<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>מבחן מילים חכם</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { min-height: 100vh; background: #f0f4ff; font-family: -apple-system, Arial, sans-serif; color: #1a1d2e; direction: rtl; }
.screen { display: none; min-height: 100vh; flex-direction: column; align-items: center; }
.screen.active { display: flex; }
.setup-inner { width: 100%; max-width: 460px; padding: 2rem 1rem 3rem; display: flex; flex-direction: column; gap: 1.25rem; }
.app-logo { text-align: center; }
.app-logo .icon { font-size: 44px; }
.app-logo h1 { font-size: 24px; font-weight: 800; margin: 6px 0 2px; }
.app-logo p { font-size: 13px; color: #7a7f9a; }
.card { background: #fff; border-radius: 20px; padding: 1.5rem; box-shadow: 0 2px 16px rgba(79,110,247,.08); display: flex; flex-direction: column; gap: 1.1rem; }
.card h2 { font-size: 16px; font-weight: 700; }
.lbl { font-size: 12px; font-weight: 600; color: #7a7f9a; margin-bottom: 5px; }
.name-inp { width: 100%; border: 2px solid #dde3f5; border-radius: 12px; padding: 11px 13px; font-size: 15px; font-family: inherit; color: #1a1d2e; outline: none; direction: rtl; }
.name-inp:focus { border-color: #4f6ef7; }
.grade-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 7px; }
.gbtn { background: #eef1ff; color: #4f6ef7; border: 2px solid transparent; border-radius: 11px; padding: 9px 3px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; }
.gbtn.sel { background: #4f6ef7; color: #fff; }
.word-count { font-size: 12px; color: #7a7f9a; text-align: center; margin-top: 4px; }
.diff-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.dbtn { border: 2px solid #dde3f5; border-radius: 12px; padding: 11px 6px; cursor: pointer; font-family: inherit; font-weight: 600; font-size: 13px; display: flex; flex-direction: column; align-items: center; gap: 3px; background: #fff; }
.dbtn .di { font-size: 18px; }
.dbtn.easy { color: #2ebc7a; } .dbtn.easy.sel { background: #e6f9f1; border-color: #2ebc7a; }
.dbtn.med  { color: #f7a24f; } .dbtn.med.sel  { background: #fff8ee; border-color: #f7a24f; }
.dbtn.hard { color: #e0455a; } .dbtn.hard.sel { background: #fdeef0; border-color: #e0455a; }
.diff-pts { font-size: 10px; font-weight: 700; margin-top: 1px; }
.cnt-row { display: grid; grid-template-columns: repeat(4,1fr); gap: 7px; }
.cbtn { border: 2px solid #dde3f5; border-radius: 11px; padding: 9px; font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; color: #7a7f9a; background: #fff; }
.cbtn.sel { background: #4f6ef7; color: #fff; border-color: #4f6ef7; }
.start-btn { background: #4f6ef7; color: #fff; border: none; border-radius: 16px; padding: 15px; font-size: 17px; font-weight: 800; font-family: inherit; cursor: pointer; width: 100%; }
.lb-btn { background: #fff; color: #4f6ef7; border: 2px solid #4f6ef7; border-radius: 16px; padding: 13px; font-size: 15px; font-weight: 800; font-family: inherit; cursor: pointer; width: 100%; }
.err-box { background: #fdeef0; border: 2px solid #e0455a; border-radius: 12px; padding: 10px 14px; font-size: 13px; color: #e0455a; text-align: center; }
/* QUIZ */
.quiz-inner { width: 100%; max-width: 520px; padding: 1.2rem 1rem 2.5rem; display: flex; flex-direction: column; gap: .9rem; }
.qhdr { display: flex; justify-content: space-between; align-items: center; }
.lvl-tag { background: #eef1ff; color: #4f6ef7; font-size: 12px; font-weight: 700; padding: 4px 12px; border-radius: 99px; }
.sc-tag { font-size: 13px; font-weight: 700; color: #7a7f9a; }
.pts-tag { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 99px; }
.pts-easy { background: #e6f9f1; color: #2ebc7a; }
.pts-medium { background: #fff8ee; color: #f7a24f; }
.pts-hard { background: #fdeef0; color: #e0455a; }
.prog-track { height: 6px; background: #dde3f5; border-radius: 99px; overflow: hidden; }
.prog-fill { height: 100%; background: linear-gradient(90deg,#4f6ef7,#f7a24f); border-radius: 99px; transition: width .4s; }
.qcard { background: #fff; border-radius: 20px; padding: 1.6rem 1.4rem 1.4rem; box-shadow: 0 2px 16px rgba(79,110,247,.08); }
.qnum { font-size: 12px; color: #7a7f9a; font-weight: 600; margin-bottom: 7px; }
.qword { font-size: clamp(26px,8vw,40px); font-weight: 800; margin-bottom: 3px; }
.qhint { font-size: 13px; color: #7a7f9a; margin-bottom: 1.1rem; }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
.opt { background: #eef1ff; border: 2px solid transparent; border-radius: 13px; padding: 13px 9px; font-size: 15px; font-weight: 600; color: #4f6ef7; cursor: pointer; text-align: center; font-family: inherit; line-height: 1.3; }
.opt:disabled { cursor: default; }
.opt.correct { background: #e6f9f1; border-color: #2ebc7a; color: #1a7a52; }
.opt.wrong   { background: #fdeef0; border-color: #e0455a; color: #a01f2e; }
.fb { min-height: 28px; margin-top: 10px; font-size: 14px; font-weight: 600; }
.fb.ok { color: #2ebc7a; } .fb.no { color: #e0455a; }
.nav { display: flex; justify-content: space-between; }
.nav-btn { background: #fff; border: 2px solid #dde3f5; border-radius: 11px; padding: 9px 20px; font-size: 14px; font-weight: 700; font-family: inherit; color: #7a7f9a; cursor: pointer; }
.nav-btn:disabled { opacity: .3; cursor: default; }
.nav-btn.pri { background: #4f6ef7; border-color: #4f6ef7; color: #fff; }
.streak-toast { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); background: #f7a24f; color: #fff; font-weight: 800; font-size: 13px; padding: 7px 18px; border-radius: 99px; z-index: 999; white-space: nowrap; opacity: 0; transition: opacity .25s; pointer-events: none; }
.streak-toast.show { opacity: 1; }
/* RESULT */
.res-inner { padding: 2.5rem 1.25rem 3rem; display: flex; flex-direction: column; align-items: center; text-align: center; gap: .9rem; justify-content: center; flex: 1; max-width: 400px; margin: 0 auto; }
.res-emoji { font-size: 60px; }
.res-score { font-size: 50px; font-weight: 900; color: #4f6ef7; line-height: 1; }
.res-of { font-size: 15px; color: #7a7f9a; margin-top: 2px; }
.res-pts { font-size: 22px; font-weight: 800; color: #f7a24f; }
.res-title { font-size: 22px; font-weight: 800; }
.res-msg { font-size: 14px; color: #7a7f9a; line-height: 1.6; max-width: 280px; }
.res-actions { display: flex; flex-direction: column; gap: 9px; width: 100%; margin-top: 6px; }
.res-btn { border-radius: 13px; padding: 13px; font-size: 15px; font-weight: 800; font-family: inherit; cursor: pointer; width: 100%; border: none; }
.res-btn.pri { background: #4f6ef7; color: #fff; }
.res-btn.sec { background: #fff; color: #4f6ef7; border: 2px solid #dde3f5; }
.res-btn.gold { background: #f7a24f; color: #fff; }
/* LEADERBOARD */
.lb-inner { width: 100%; max-width: 520px; padding: 1.5rem 1rem 3rem; display: flex; flex-direction: column; gap: 1rem; }
.lb-inner h2 { font-size: 22px; font-weight: 800; text-align: center; }
.lb-inner p { font-size: 13px; color: #7a7f9a; text-align: center; margin-top: -8px; }
.lb-table { background: #fff; border-radius: 20px; overflow: hidden; box-shadow: 0 2px 16px rgba(79,110,247,.08); }
.lb-row { display: grid; grid-template-columns: 40px 1fr 70px 70px 60px; padding: 12px 16px; border-bottom: 1px solid #f0f0f8; align-items: center; gap: 8px; font-size: 13px; }
.lb-row.header { background: #eef1ff; font-weight: 700; font-size: 11px; color: #7a7f9a; }
.lb-row:last-child { border-bottom: none; }
.lb-rank { font-weight: 800; font-size: 16px; text-align: center; }
.lb-rank.gold { color: #f7a24f; }
.lb-rank.silver { color: #a0a0b0; }
.lb-rank.bronze { color: #cd7f32; }
.lb-name { font-weight: 700; }
.lb-pts { font-weight: 800; color: #4f6ef7; text-align: center; }
.lb-words { text-align: center; color: #7a7f9a; }
.lb-diff { text-align: center; font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 99px; }
.lb-diff.easy { background: #e6f9f1; color: #2ebc7a; }
.lb-diff.medium { background: #fff8ee; color: #f7a24f; }
.lb-diff.hard { background: #fdeef0; color: #e0455a; }
.back-btn { background: #fff; border: 2px solid #dde3f5; border-radius: 12px; padding: 10px 20px; font-size: 14px; font-weight: 700; font-family: inherit; color: #7a7f9a; cursor: pointer; align-self: flex-start; }
.loading-lb { text-align: center; padding: 2rem; color: #7a7f9a; }
@media (max-width: 380px) { .opts { grid-template-columns: 1fr; } .lb-row { grid-template-columns: 30px 1fr 60px 50px; } }
</style>
</head>
<body>
<div class="streak-toast" id="streak-toast"></div>

<!-- SETUP -->
<div id="screen-setup" class="screen active">
  <div class="setup-inner">
    <div class="app-logo">
      <div class="icon">🧠</div>
      <h1>מבחן מילים חכם</h1>
      <p>עובד ללא אינטרנט • לוח מובילים חי</p>
    </div>
    <div class="card">
      <h2>הגדרות המבחן</h2>
      <div>
        <div class="lbl">שם התלמיד (חובה לדירוג)</div>
        <input id="inp-name" class="name-inp" type="text" placeholder="למשל: איתי" />
      </div>
      <div>
        <div class="lbl">כיתה</div>
        <div class="grade-grid" id="grade-grid">
          <button class="gbtn" data-g="1">א'</button><button class="gbtn" data-g="2">ב'</button>
          <button class="gbtn" data-g="3">ג'</button><button class="gbtn" data-g="4">ד'</button>
          <button class="gbtn" data-g="5">ה'</button><button class="gbtn" data-g="6">ו'</button>
          <button class="gbtn" data-g="7">ז'</button><button class="gbtn" data-g="8">ח'</button>
          <button class="gbtn" data-g="9">ט'</button><button class="gbtn" data-g="10">י'</button>
          <button class="gbtn" data-g="11">י"א</button><button class="gbtn" data-g="12">י"ב</button>
        </div>
        <div class="word-count" id="word-count"></div>
      </div>
      <div>
        <div class="lbl">רמת קושי — ניקוד שונה לכל רמה!</div>
        <div class="diff-row">
          <button class="dbtn easy" data-d="easy"><span class="di">😊</span>קל<span class="diff-pts" style="color:#2ebc7a">10 נק' למילה</span></button>
          <button class="dbtn med"  data-d="medium"><span class="di">😤</span>בינוני<span class="diff-pts" style="color:#f7a24f">15 נק' למילה</span></button>
          <button class="dbtn hard" data-d="hard"><span class="di">🔥</span>קשה<span class="diff-pts" style="color:#e0455a">20 נק' למילה</span></button>
        </div>
      </div>
      <div>
        <div class="lbl">מספר שאלות</div>
        <div class="cnt-row">
          <button class="cbtn" data-c="10">10</button>
          <button class="cbtn sel" data-c="20">20</button>
          <button class="cbtn" data-c="30">30</button>
          <button class="cbtn" data-c="40">40</button>
        </div>
      </div>
      <div id="setup-err" style="display:none"></div>
    </div>
    <button class="start-btn" onclick="startQuiz()">התחל מבחן ✨</button>
    <button class="lb-btn" onclick="showLeaderboard()">🏆 לוח מובילים</button>
  </div>
</div>

<!-- QUIZ -->
<div id="screen-quiz" class="screen">
  <div class="quiz-inner">
    <div class="qhdr">
      <div class="lvl-tag" id="lvl-tag"></div>
      <div style="display:flex;gap:8px;align-items:center">
        <div class="pts-tag" id="pts-tag"></div>
        <div class="sc-tag" id="sc-tag">ניקוד: 0</div>
      </div>
    </div>
    <div class="prog-track"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
    <div id="quiz-body"></div>
  </div>
</div>

<!-- RESULT -->
<div id="screen-result" class="screen">
  <div class="res-inner" id="res-inner"></div>
</div>

<!-- LEADERBOARD -->
<div id="screen-lb" class="screen">
  <div class="lb-inner">
    <button class="back-btn" onclick="showScreen('screen-setup')">← חזרה</button>
    <h2>🏆 לוח מובילים</h2>
    <p>מעודכן בזמן אמת מכל המכשירים</p>
    <div id="lb-content" class="loading-lb">טוען...</div>
  </div>
</div>

function getWordPool(grade, diff) {
  const g = parseInt(grade);
  let grades;
  if (diff==='easy') grades=[Math.max(1,g-2),Math.max(1,g-1)];
  else if (diff==='medium') grades=[Math.max(1,g-1),g];
  else grades=[g,Math.min(12,g+1)];
  let pool=[];
  grades.forEach(gr=>{const k=String(gr);if(DB[k])pool=pool.concat(DB[k]);});
  if(DB[g])pool=pool.concat(DB[g]);
  const seen=new Set();
  return pool.filter(w=>{if(seen.has(w[0]))return false;seen.add(w[0]);return true;});
}

function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}

let cfg={grade:null,diff:null,count:20,name:''};

document.querySelectorAll('.gbtn').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.gbtn').forEach(x=>x.classList.remove('sel'));
  b.classList.add('sel');cfg.grade=+b.dataset.g;
  const pool=getWordPool(cfg.grade,cfg.diff||'medium');
  document.getElementById('word-count').textContent=pool.length+' מילים במאגר לרמה זו';
}));
document.querySelectorAll('.dbtn').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.dbtn').forEach(x=>x.classList.remove('sel'));

  if(cfg.grade){const pool=getWordPool(cfg.grade,cfg.diff);document.getElementById('word-count').textContent=pool.length+' מילים במאגר לרמה זו';}
}));
document.querySelectorAll('.cbtn').forEach(b=>b.addEventListener('click',()=>{

}));

window.showScreen=function(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');}

window.startQuiz=function(){
  cfg.name=document.getElementById('inp-name').value.trim();
  if(!cfg.grade||!cfg.diff){
    const e=document.getElementById('setup-err');e.style.display='block';
    e.innerHTML='<div class="err-box">⚠️ נא לבחור כיתה ורמת קושי</div>';return;
  }
  const pool=getWordPool(cfg.grade,cfg.diff);
  const n=Math.min(cfg.count,pool.length);
  questions=shuffle(pool).slice(0,n).map(row=>({word:row[0],correct:row[1],opts:shuffle([row[1],row[2],row[3],row[4],row[5]]).slice(0,5)}));
  cur=0;score=0;totalPts=0;streak=0;answers=new Array(questions.length).fill(null);
  const dl={easy:'קל',medium:'בינוני',hard:'קשה'};
  const ptsCls={easy:'pts-easy',medium:'pts-medium',hard:'pts-hard'};
  document.getElementById('lvl-tag').textContent='כיתה '+GL[cfg.grade]+' • '+dl[cfg.diff];
  document.getElementById('pts-tag').className='pts-tag '+ptsCls[cfg.diff];
  document.getElementById('pts-tag').textContent=PTS[cfg.diff]+' נק\' למילה';
  showScreen('screen-quiz');renderQ();
}

function renderQ(){
  const total=questions.length;
  document.getElementById('prog-fill').style.width=Math.round(cur/total*100)+'%';
  document.getElementById('sc-tag').textContent='ניקוד: '+totalPts;
  if(cur>=total){showResult();return;}
  const q=questions[cur],ans=answers[cur];
  const opts=q.opts.map((o,i)=>{
    let cls='opt';
    if(ans!==null){if(o===q.correct)cls+=' correct';else if(o===ans)cls+=' wrong';}
    return`<button class="${cls}" ${ans!==null?'disabled':''} onclick="choose(${i})">${o}</button>`;
  }).join('');
  let fb='<div class="fb"></div>';
  if(ans!==null){
    if(ans===q.correct)fb=`<div class="fb ok">✓ נכון! +${PTS[cfg.diff]} נקודות</div>`;
    else fb=`<div class="fb no">✗ התשובה הנכונה: <strong>${q.correct}</strong></div>`;
  }
  const isLast=cur===total-1;
  document.getElementById('quiz-body').innerHTML=`
    <div class="qcard">
      <div class="qnum">שאלה ${cur+1} מתוך ${total}</div>
      <div class="qword">${q.word}</div>
      <div class="qhint">מה הפירוש בעברית?</div>
      <div class="opts">${opts}</div>${fb}
    </div>
    <div class="nav">
      <button class="nav-btn" onclick="prev()" ${cur===0?'disabled':''}>→ הקודמת</button>
      <button class="nav-btn pri" onclick="next()" ${ans===null?'disabled':''}>${isLast?'לתוצאות ←':'הבאה ←'}</button>
    </div>`;
}

window.choose=function(i){
  if(answers[cur]!==null)return;
  const o=questions[cur].opts[i];answers[cur]=o;
  if(o===questions[cur].correct){
    score++;totalPts+=PTS[cfg.diff];streak++;
    if(streak>=3)showStreak(streak);
  }else{streak=0;}
  renderQ();
}
window.next=function(){if(cur<questions.length-1){cur++;renderQ();}else showResult();}
window.prev=function(){if(cur>0){cur--;renderQ();}}
function showStreak(n){const el=document.getElementById('streak-toast');el.textContent=n+' רצף נכון! 🔥';el.classList.add('show');clearTimeout(stTimer);stTimer=setTimeout(()=>el.classList.remove('show'),1800);}

async function showResult(){
  const total=questions.length;
  const fs=answers.filter((a,i)=>a===questions[i].correct).length;
  const pct=Math.round(fs/total*100);
  const name=cfg.name||'תלמיד';
  let emoji,title,msg;
  if(pct>=90){emoji='🏆';title=`מושלם, ${name}!`;msg='תוצאה מרשימה!';}
  else if(pct>=75){emoji='🌟';title=`יפה מאוד, ${name}!`;msg='תוצאה טובה מאוד!';}
  else if(pct>=55){emoji='👍';title=`לא רע, ${name}!`;msg='כדאי לתרגל עוד.';}
  else{emoji='📚';title=`ממשיכים להתאמן, ${name}!`;msg='תרגל עוד — אתה יכול!';}

  showScreen('screen-result');
  document.getElementById('res-inner').innerHTML=`
    <div class="res-emoji">${emoji}</div>
    <div><div class="res-score">${fs}/${total}</div><div class="res-of">${pct}%</div></div>
    <div class="res-pts">🏅 ${totalPts} נקודות</div>
    <div class="res-title">${title}</div>
    <div class="res-msg">${msg}</div>
    <div id="save-status" style="font-size:13px;color:#7a7f9a">שומר לדירוג...</div>
    <div class="res-actions">
      <button class="res-btn gold" onclick="showLeaderboard()">🏆 לוח מובילים</button>
      <button class="res-btn pri" onclick="startQuiz()">שחק שוב 🔄</button>
      <button class="res-btn sec" onclick="showScreen('screen-setup')">שנה הגדרות ⚙️</button>
    </div>`;

  // Save to Firebase
  if(cfg.name && window._db){
    try{
      await window._addDoc(window._collection(window._db,'scores'),{
        name: cfg.name,
        grade: cfg.grade,
        diff: cfg.diff,
        score: fs,
        total: total,
        pts: totalPts,
        pct: pct,
        ts: Date.now()
      });
      document.getElementById('save-status').textContent='✓ נשמר בדירוג!';
    }catch(e){
      document.getElementById('save-status').textContent='לא נשמר (אין אינטרנט)';
    }
  } else if(!cfg.name){
    document.getElementById('save-status').textContent='הכנס שם כדי להופיע בדירוג';
  }
}

window.showLeaderboard=async function(){
  showScreen('screen-lb');
  document.getElementById('lb-content').innerHTML='<div class="loading-lb">טוען נתונים... ⏳</div>';
  if(!window._db){
    document.getElementById('lb-content').innerHTML='<div class="loading-lb">אין חיבור לאינטרנט</div>';
    return;
  }
  try{
    const q=window._query(window._collection(window._db,'scores'),window._orderBy('pts','desc'),window._limit(50));
    const snap=await window._getDocs(q);
    const rows=[];
    snap.forEach(doc=>rows.push(doc.data()));

    // Best score per student
    const best={};
    rows.forEach(r=>{
      if(!best[r.name]||r.pts>best[r.name].pts)best[r.name]=r;
    });
    const sorted=Object.values(best).sort((a,b)=>b.pts-a.pts);

    if(sorted.length===0){
      document.getElementById('lb-content').innerHTML='<div class="loading-lb">אין תוצאות עדיין — היה הראשון! 🚀</div>';
      return;
    }

    const diffHe={easy:'קל',medium:'בינוני',hard:'קשה'};
    const rankIcon=['🥇','🥈','🥉'];
    let html='<div class="lb-table">';
    html+='<div class="lb-row header"><div>מקום</div><div>שם</div><div style="text-align:center">נקודות</div><div style="text-align:center">מילים</div><div style="text-align:center">רמה</div></div>';
    sorted.forEach((r,i)=>{
      const rank=i<3?rankIcon[i]:`${i+1}`;
      const rankCls=i===0?'gold':i===1?'silver':i===2?'bronze':'';
      html+=`<div class="lb-row">
        <div class="lb-rank ${rankCls}">${rank}</div>
        <div class="lb-name">${r.name}</div>
        <div class="lb-pts">${r.pts}</div>
        <div class="lb-words">${r.score}/${r.total}</div>
        <div><span class="lb-diff ${r.diff}">${diffHe[r.diff]||r.diff}</span></div>
      </div>`;
    });
    html+='</div>';
    document.getElementById('lb-content').innerHTML=html;
  }catch(e){
    document.getElementById('lb-content').innerHTML='<div class="loading-lb">שגיאה בטעינת הדירוג</div>';
  }
}
</script>
</body>
</html>
